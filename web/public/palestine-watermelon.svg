<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 360" width="128" height="360" fill="none">
  <defs>
    <linearGradient id="flagRed" x1="0" y1="0" x2="128" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C81E1E" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>
    <linearGradient id="melonFlesh" x1="-44" y1="0" x2="44" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#DC2626" />
      <stop offset="55%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#B91C1C" />
    </linearGradient>
    <linearGradient id="melonRind" x1="-56" y1="0" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22C55E" />
      <stop offset="50%" stop-color="#16A34A" />
      <stop offset="100%" stop-color="#15803D" />
    </linearGradient>
    <filter id="sliceShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.35" />
    </filter>
    <clipPath id="bannerClip">
      <polygon points="0,0 128,0 128,276 64,322 0,276" />
    </clipPath>
  </defs>

  <!-- Bottom White Keffiyeh Fringes -->
  <g stroke="#E2E8F0" stroke-width="2.4" stroke-linecap="round">
    <line x1="3" y1="278" x2="3" y2="302" />
    <line x1="8" y1="282" x2="8" y2="306" />
    <line x1="13" y1="285" x2="13" y2="309" />
