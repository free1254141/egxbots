name: Wake Facebook scheduler

on:
  schedule:
    # Cairo is UTC+3. Wake the Space shortly after each Facebook slot.
    - cron: "50 5 * * 0-4"
    - cron: "50 15 * * 0-4"
    - cron: "35 18 * * 0-4"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wake-facebook-scheduler
  cancel-in-progress: false

jobs:
  wake-space:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Wake Hugging Face Space and wait for health endpoint
        shell: bash
        run: |
          set -euo pipefail
          URL="https://weeasdwee-ai-bot.hf.space/health"
          for attempt in 1 2 3 4 5 6; do
            echo "Wake attempt ${attempt}/6"
            if curl --fail --silent --show-error --max-time 240 "${URL}"; then
              echo
              echo "Space health endpoint responded."
              exit 0
            fi
            sleep 15
          done
          echo "Space did not become healthy in time; scheduler catch-up will run on the next wake." >&2
          exit 1
